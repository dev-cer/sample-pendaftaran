<div id="area" class="rounded-2xl bg-white p-6 shadow-sm ring-2 ring-emerald-600">
  <p class="text-sm font-bold uppercase tracking-widest text-emerald-700">Pendaftaran berhasil</p>
  <p class="mt-2 font-mono text-3xl font-extrabold">{{ p.nomor }}</p>
  <dl class="mt-4 grid grid-cols-[auto_1fr] gap-x-6 gap-y-2 text-sm">
    <dt class="text-slate-500">Nama</dt><dd class="font-semibold">{{ p.nama }}</dd>
    <dt class="text-slate-500">NISN</dt><dd class="font-mono">{{ p.nisn_tersamar }}</dd>
    <dt class="text-slate-500">Sekolah</dt><dd>{{ p.sekolah.nama }}</dd>
    <dt class="text-slate-500">Jalur</dt><dd>{{ p.jalur.label() }}</dd>
    <dt class="text-slate-500">Waktu</dt><dd>{{ p.waktu }}</dd>
    <dt class="text-slate-500">Kode verifikasi</dt><dd class="font-mono">{{ p.kode_verifikasi }}</dd>
    <dt class="text-slate-500">Diproses pod</dt><dd class="font-mono">{{ app.pod }}</dd>
  </dl>
  <a href="/daftar" class="mt-6 inline-block rounded-xl border border-slate-300 px-5 py-2 font-semibold hover:bg-slate-50">Daftarkan anak lain</a>
</div>
