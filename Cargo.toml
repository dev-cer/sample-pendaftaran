[package]
name = "ppdb-portal"
version = "0.1.0"
edition = "2021"
description = "Portal PPDB Online (sampel) - Rust full-stack MVC: Axum + Askama + HTMX + Tailwind"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
