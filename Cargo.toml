# Portal PPDB Online: 2 microservice Rust, masing-masing berpola MVC.
#   web/  ppdb-web  halaman portal (Askama + HTMX + Tailwind), memanggil ppdb-api
#   api/  ppdb-api  REST API pendaftaran (validasi, verifikasi, kuota)
[workspace]
members = ["api", "web"]
resolver = "2"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
