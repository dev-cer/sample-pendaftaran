# Build 2 image microservice dan push ke GitHub Container Registry (satu package):
#   ghcr.io/<owner>/sample-pendaftaran:web-<short-sha>  :web-latest
#   ghcr.io/<owner>/sample-pendaftaran:api-<short-sha>  :api-latest
# Setelah run pertama: GitHub -> Packages -> sample-pendaftaran -> Package settings -> Change visibility -> Public,
# supaya cluster bisa pull tanpa kredensial (image tidak berisi secret).
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sample-pendaftaran
          tags: |
            type=sha,format=short,prefix=${{ matrix.service }}-
            type=raw,value=${{ matrix.service }}-latest,enable={{is_default_branch}}
            type=ref,event=tag,prefix=${{ matrix.service }}-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
