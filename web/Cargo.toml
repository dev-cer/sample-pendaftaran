[package]
name = "ppdb-web"
version = "0.2.0"
edition = "2021"
description = "PPDB Web: halaman portal (MVC, Askama + HTMX + Tailwind), memanggil ppdb-api"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
askama = "0.12"
tower-http = { version = "0.5", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
